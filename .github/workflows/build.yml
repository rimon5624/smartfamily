name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check generated table code is up to date
        run: |
          python3 scripts/gen_tables.py
          git diff --exit-code -- app/src supabase || (echo "::error::Run python3 scripts/gen_tables.py and commit the result" && exit 1)

      - name: Check Hebrew and English strings match
        run: python3 scripts/check_strings.py

      - name: Firebase config (instant notifications)
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS" ]; then printf '%s' "$GS" > app/google-services.json; python3 -c "import json;d=json.load(open('app/google-services.json'));print('Firebase project:', d['project_info']['project_id'], '· apps:', [c['client_info']['android_client_info']['package_name'] for c in d['client']])"; else echo "::warning::No GOOGLE_SERVICES_JSON secret: built without instant notifications"; fi

      - name: Read version
        id: ver
        run: echo "name=$(grep '^APP_VERSION_NAME=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Restore and check signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          WANT_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::No SIGNING_KEYSTORE_BASE64 secret: APK is signed with a temporary debug key and cannot update a previously installed build."
            exit 0
          fi
          # Tolerate line breaks or spaces pasted into the secret.
          echo "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.jks"
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$STORE_PW" > "$RUNNER_TEMP/ks.txt" 2>&1; then
            echo "::error::Cannot open the keystore: SIGNING_KEYSTORE_PASSWORD is wrong or SIGNING_KEYSTORE_BASE64 is not a valid keystore."
            exit 1
          fi
          # Key names in the keystore (not printed: this repository's logs are public).
          grep -E 'PrivateKeyEntry' "$RUNNER_TEMP/ks.txt" | sed 's/,.*//' > "$RUNNER_TEMP/aliases.txt"
          count=$(wc -l < "$RUNNER_TEMP/aliases.txt")
          want=$(printf '%s' "$WANT_ALIAS" | tr -d '\r\n' | sed 's/^ *//; s/ *$//')
          match=$(grep -ixF -- "$want" "$RUNNER_TEMP/aliases.txt" | head -1 || true)
          if [ -z "$match" ] && [ "$count" = "1" ]; then
            match=$(cat "$RUNNER_TEMP/aliases.txt")
            echo "::warning::SIGNING_KEY_ALIAS does not match the key in the keystore; the keystore holds exactly one key, so that key is used. Update the secret to remove this warning."
          fi
          if [ -z "$match" ]; then
            echo "::error::SIGNING_KEY_ALIAS matches none of the $count keys in the keystore. Set it to the alias used when the key was created."
            exit 1
          fi
          echo "::add-mask::$match"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS_RESOLVED=$match" >> "$GITHUB_ENV"
          echo "Release key found ($count key(s) in keystore)"

      - name: Build release APK
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle --no-daemon :app:testReleaseUnitTest :app:assembleRelease

      - name: Verify database migrations match the Room schema
        run: python3 scripts/verify_migrations.py

      - uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas
          retention-days: 7

      - name: Name APK with version
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/smartfamily-v${{ steps.ver.outputs.name }}.apk"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: smartfamily-v${{ steps.ver.outputs.name }}
          path: out/*.apk
          retention-days: 7

  # Walks through every screen on an Android emulator (Hebrew, all features on) and keeps a screenshot of each.
  ui-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Firebase config (instant notifications)
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS" ]; then printf '%s' "$GS" > app/google-services.json; python3 -c "import json;d=json.load(open('app/google-services.json'));print('Firebase project:', d['project_info']['project_id'], '· apps:', [c['client_info']['android_client_info']['package_name'] for c in d['client']])"; else echo "::warning::No GOOGLE_SERVICES_JSON secret: built without instant notifications"; fi

      - name: Build app and tests
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease
      - name: Run the walkthrough on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell settings put global hide_error_dialogs 1
            adb root || true; sleep 3
            adb shell setprop persist.sys.locale he-IL
            adb shell stop; sleep 2; adb shell start
            adb wait-for-device; until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; do sleep 3; done; sleep 15
            adb shell input keyevent 82 || true
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS || true
            adb shell getprop persist.sys.locale
            adb shell am instrument -w -r com.rimon.smartfamily.test/androidx.test.runner.AndroidJUnitRunner | tee instrument.txt
            mkdir -p screens && adb pull /sdcard/Android/data/com.rimon.smartfamily/files/screens screens/ || true
            adb logcat -d -t 3000 '*:E' > logcat-errors.txt || true
            grep -q "OK (" instrument.txt
            # 2.2: smoke test of the shrunk/obfuscated release build (same debug key here) over the test data
            adb logcat -c
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb shell am start -W -n com.rimon.smartfamily/.MainActivity
            sleep 25
            adb shell screencap -p /sdcard/release.png && adb pull /sdcard/release.png screens/release_smoke.png || true
            adb logcat -d > release-logcat.txt || true
            if grep -q "FATAL EXCEPTION" release-logcat.txt; then grep -A30 "FATAL EXCEPTION" release-logcat.txt | head -60; exit 1; fi
            adb shell pidof com.rimon.smartfamily
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screens
          path: |
            screens
            instrument.txt
            logcat-errors.txt
            release-logcat.txt
          retention-days: 7

  # Each new version on main becomes a GitHub release with its APK, which the app's update check reads.
  # It is published only after the build AND the on-device walkthrough passed. Existing versions are skipped.
  release:
    needs: [build, ui-test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: ver
        run: echo "name=$(grep '^APP_VERSION_NAME=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: smartfamily-v${{ steps.ver.outputs.name }}
          path: out
      - name: Is this version released yet?
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.ver.outputs.name }}" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish GitHub release
        if: steps.rel.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: SmartFamily ${{ steps.ver.outputs.name }}
          files: out/*.apk
          generate_release_notes: true
